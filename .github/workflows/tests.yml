---
name: "Tests"

on:
  push:
    paths-ignore:
      - "**.md"
      - 'docs/**'
    # Prevent duplicating jobs on PR-s from local branches
    branches:
      - "master"
  pull_request:
    paths-ignore:
      - "**.md"
      - 'docs/**'
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: tests-${{ github.head_ref || github.run_id }} # will be canceled on subsequent pushes in pull requests but not branches
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        laravel: ["^12.0", "^13.0"]
        dependencies:
          - "lowest"
          - "highest"

    name: "PHP${{ matrix.php }} - Laravel${{ matrix.laravel }} ${{ matrix.dependencies == 'highest' && '↑' || '↓' }}"

    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v6"

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php }}"
          extensions: "dom, curl, libxml, mbstring, zip, fileinfo"
          tools: "composer:v2"
          coverage: "none"

      - name: "Check Composer configuration"
        run: "composer validate"

      - name: "Check file permissions"
        run: |
          printf '%s\n' ./tests/analyse.sh \
            | diff - <(find . -type f -not -path './.git/*' -executable | sort)
        shell: "bash"

      - name: "Install lowest dependencies from composer.json"
        if: "matrix.dependencies == 'lowest'"
        run: "composer update --with='laravel/framework:${{ matrix.laravel }}' --no-interaction --no-progress --prefer-lowest"

      - name: "Install highest dependencies from composer.json"
        if: "matrix.dependencies == 'highest'"
        run: "composer update --with='laravel/framework:${{ matrix.laravel }}' --no-interaction --no-progress"

      - name: "Check PSR-4 mapping"
        run: "composer dump-autoload --optimize --strict-psr"

      - name: "Execute unit tests"
        run: "composer run-script test:unit"

      - name: "Analyse a sample Laravel application"
        run: |
          version="${{ matrix.laravel }}"
          version="${version%%.*}.0"
          tests/analyse.sh laravel "$version"

  sql-parser:
    name: "SQL parser: ${{ matrix.parser }} only"

    runs-on: "ubuntu-latest"

    strategy:
      fail-fast: false
      matrix:
        parser: ["iamcal", "phpmyadmin"]

    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v6"

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.3"
          extensions: "dom, curl, libxml, mbstring, zip, fileinfo"
          tools: "composer:v2"
          coverage: "none"

      - name: "Install dependencies from composer.json"
        run: "composer update --no-interaction --no-progress"

      # Both parsers are optional, so each has to be able to carry the suite on
      # its own. Removing the other one is the only way to prove it.
      - name: "Uninstall the other parser"
        run: |
          if [ "${{ matrix.parser }}" = "iamcal" ]; then
            composer remove --dev --no-interaction --no-progress phpmyadmin/sql-parser
          else
            composer remove --dev --no-interaction --no-progress iamcal/sql-parser
          fi

      - name: "Confirm exactly one parser is installed"
        run: |
          installed="$(composer show --name-only 2>/dev/null | grep -c 'sql-parser' || true)"
          test "$installed" -eq 1
          composer show --name-only | grep 'sql-parser'

      - name: "Execute unit tests"
        run: "composer run-script test:unit"

      - name: "Execute static analysis"
        run: "composer run-script test:types"
