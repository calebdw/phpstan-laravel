[project]
site_name = "phpstan-laravel"
site_description = "A PHPStan extension for analysis of Laravel applications and packages."
site_url = "https://phpstan-laravel.dev/"
repo_url = "https://github.com/calebdw/phpstan-laravel"
repo_name = "calebdw/phpstan-laravel"
edit_uri = "edit/master/docs/"
copyright = "Released under the MIT license."
extra_css = ["assets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Configuration" = "getting-started/configuration.md" },
    { "Analysing a package" = "getting-started/packages.md" },
  ]},
  { "Guide" = [
    { "Booting your application" = "guide/booting.md" },
    { "Model properties" = "guide/model-properties.md" },
    { "Builders, factories and collections" = "guide/eloquent.md" },
    { "Relations" = "guide/relations.md" },
    { "Collections" = "guide/collections.md" },
    { "Configuration types" = "guide/config-types.md" },
    { "Custom types" = "guide/custom-types.md" },
  ]},
  { "Rules" = [
    { "Overview" = "rules/index.md" },
    { "Eloquent" = "rules/eloquent.md" },
    { "Collections" = "rules/collections.md" },
    { "Configuration" = "rules/config.md" },
    { "Views and translations" = "rules/views-and-translations.md" },
    { "Framework" = "rules/framework.md" },
  ]},
  { "Reference" = [
    { "Configuration options" = "reference/configuration.md" },
    { "Error identifiers" = "reference/identifiers.md" },
  ]},
  { "Migrating from Larastan" = "migrating-from-larastan.md" },
  { "About" = [
    { "FAQ" = "about/faq.md" },
    { "Troubleshooting" = "about/troubleshooting.md" },
    { "Differences from Larastan" = "about/differences-from-larastan.md" },
    { "Backward compatibility" = "about/backward-compatibility.md" },
  ]},
]

[project.theme]
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "red"
accent = "red"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "red"
accent = "red"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"


[project.extra.version]
provider = "mike"
alias = true

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/calebdw/phpstan-laravel"
name = "phpstan-laravel on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/php"
link = "https://packagist.org/packages/calebdw/phpstan-laravel"
name = "phpstan-laravel on Packagist"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.smarty]
smart_quotes = false
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

# Pygments' PHP lexer emits no tokens without a <?php tag, which left almost
# every snippet here unhighlighted. Override the `php` language to open in code
# mode, so a bare expression highlights and a block with <?php still does too.
[[project.markdown_extensions.pymdownx.highlight.extend_pygments_lang]]
name = "php"
lang = "php"
options = { startinline = true }
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
